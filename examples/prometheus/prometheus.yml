global:
  scrape_interval: 15s # How frequently to scrape targets
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector-telemetry"
    static_configs:
      # host.docker.internal maps to the localhost of the machine running Docker
      # 8888 is the default self-telemetry port for the OpenTelemetry Collector
      - targets: ["host.docker.internal:8888"]
