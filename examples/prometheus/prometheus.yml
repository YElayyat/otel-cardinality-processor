global:
  scrape_interval: 15s # How frequently to scrape targets
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector-telemetry"
    static_configs:
      # collector maps to the OpenTelemetry Collector container
      # 8888 is the default self-telemetry port for the OpenTelemetry Collector
      - targets: ["collector:8888"]
