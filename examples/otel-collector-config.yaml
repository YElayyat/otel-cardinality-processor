receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  cardinality_guardian:
    max_cardinality_delta_per_epoch: 50
    epoch_duration_seconds: 300
    never_drop_labels:
      - region
      - http.status_code
      - service.name
    tag_only: false
    estimated_cost_per_metric_month: 0.05
    top_offenders_count: 10
    max_tracker_count: 0
    metric_overrides:
      http.server.request.duration: 5000
      db.query.duration: 50

exporters:
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [cardinality_guardian]
      exporters: [debug]
