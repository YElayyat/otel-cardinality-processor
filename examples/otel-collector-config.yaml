receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  cardinality_guardian:
    max_cardinality_delta_per_epoch: 500
    epoch_duration_seconds: 300
    never_drop_labels:
      - region
      - http.status_code
      - service.name
    tag_only: false
    estimated_cost_per_metric_month: 0.05

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [cardinality_guardian]
      exporters: [debug]
