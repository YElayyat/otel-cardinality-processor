# .golangci.yml — golangci-lint configuration for otel-cardinality-processor.
#
# Install:  make install-lint
# Run:      make lint
# Docs:     https://golangci-lint.run/usage/configuration/
#
# Design philosophy:
#   - All linters are disabled by default; only explicitly listed ones run.
#     This prevents a golangci-lint upgrade from silently enabling new linters
#     and breaking CI without a deliberate configuration change.
#   - Test files have a relaxed rule set: errcheck and gosec are excluded
#     because test helpers frequently discard errors intentionally, and gosec
#     flags on intentional test inputs (e.g. binary junk in the fuzz corpus).
#   - Complexity thresholds are set conservatively. The hot path in this
#     codebase is deliberately simple; a gocyclo warning is a strong signal
#     that a function should be decomposed.

run:
  # Maximum time golangci-lint may spend on analysis before aborting.
  timeout: 5m

  # Go version must match go.mod so linters that understand generics and
  # newer language features use the correct AST.
  go: "1.25"

  # Include _test.go files in the lint pass so that test helpers, table
  # data, and fuzz seeds are held to the same quality bar as production code
  # (with the per-file exclusions defined in the `issues` section below).
  tests: true

# ---------------------------------------------------------------------------
# Enabled linters
# ---------------------------------------------------------------------------

linters:
  disable-all: true
  enable:
    # --- Correctness ---------------------------------------------------------

    # errcheck: report every error return value that is silently discarded.
    # In an OTel processor, a dropped error from meter.Int64Counter or
    # gauge registration would silently produce a non-functional component.
    - errcheck

    # govet: run all go vet analysers, including shadow, printf format checks,
    # and composite literal field-ordering checks.
    - govet

    # staticcheck: the full suite of SA* (bugs), S* (simplifications), and
    # QF* (quick-fixes) checks from staticcheck.io. Catches issues the
    # compiler does not, such as unreachable code and misused sync primitives.
    - staticcheck

    # nilerr: detect the anti-pattern `if err != nil { return nil }`, which
    # silently swallows errors and is especially dangerous in constructor paths.
    - nilerr

    # ineffassign: detect assignments whose value is never read before being
    # overwritten or going out of scope.
    - ineffassign

    # --- Security ------------------------------------------------------------

    # gosec: flag code patterns known to introduce security vulnerabilities
    # (e.g. integer overflows, weak RNG, hardcoded credentials). Important
    # for a library that processes untrusted telemetry data.
    - gosec

    # --- Complexity ----------------------------------------------------------

    # gocyclo: flag functions whose cyclomatic complexity exceeds the threshold
    # set below. High complexity is a leading indicator of untestable code and
    # subtle concurrency bugs.
    - gocyclo

    # --- Style & Maintainability ---------------------------------------------

    # misspell: catch typos in comments and string literals before they reach
    # users who read log output or documentation generated by `go doc`.
    - misspell

    # unconvert: report unnecessary type conversions (e.g. int(x) where x is
    # already an int). Common after refactors that change a field's type.
    - unconvert

    # godot: require a period at the end of every top-level doc comment.
    # go doc and pkg.go.dev render these as prose; a missing period signals
    # an incomplete or copy-pasted comment.
    - godot

    # revive: drop-in golint replacement with additional configurable rules.
    # Used here primarily to enforce doc-comment presence on exported symbols
    # and consistent naming conventions.
    - revive

# ---------------------------------------------------------------------------
# Per-linter settings
# ---------------------------------------------------------------------------

linters-settings:
  gocyclo:
    # Flag any function with cyclomatic complexity > 15.
    # The most complex function in this codebase (processMetric's type switch)
    # has complexity ≈ 7; a value of 15 gives ample headroom while still
    # catching runaway complexity before it reaches code review.
    min-complexity: 15

  errcheck:
    # Also flag unchecked type assertions: x.(T) without the `ok` form.
    check-type-assertions: true
    # Also flag `_ = f()` when f returns an error. This pattern is sometimes
    # used to satisfy an interface but should be explicit about the intent.
    check-blank: true

  gosec:
    excludes:
      # G115: integer overflow on conversion.
      # We intentionally truncate a uint64 hash to uint8 via the modulo in
      # getShard — overflow is the mechanism, not a bug.
      - G115

  misspell:
    locale: US

  godot:
    # Only enforce periods on top-level (package/type/func) comments, not
    # on every inline comment inside function bodies.
    scope: toplevel
    # Do not require an upper-case first letter; some comments begin with
    # code identifiers that are naturally lower-case (e.g. `cachedCurr`).
    capital: false

  revive:
    rules:
      # Exported symbols must have doc comments that begin with the symbol name.
      - name: exported
        severity: warning
        arguments:
          - "checkPrivateReceivers"
          - "disableStutteringCheck"
      # Enforce standard Go naming conventions (camelCase, no underscores, etc.)
      - name: var-naming
        severity: warning
      # Flag function parameters that are declared but never read.
      - name: unused-parameter
        severity: warning

# ---------------------------------------------------------------------------
# Issue filtering
# ---------------------------------------------------------------------------

issues:
  # Do not cap the number of issues reported per linter or per location.
  # Truncated output hides systematic problems that need bulk fixes.
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Test files — relax errcheck and gosec.
    # Test helpers frequently call functions purely for side-effects and
    # discard their error returns intentionally (e.g. require.NoError already
    # handles the assertion). gosec flags on intentional test data such as
    # binary sequences in the fuzz seed corpus.
    - path: "_test\\.go"
      linters:
        - errcheck
        - gosec

    # e2e test directory — same relaxations as unit test files, plus allow
    # higher complexity in orchestration helpers that spin up a full Collector.
    - path: "test/e2e/"
      linters:
        - errcheck
        - gosec
        - gocyclo
